version: '3.8'

services:
  # Core Database & Cache (Dependencies)
  db:
      image: postgres:15-alpine
      environment:
        POSTGRES_DB: instabot_db
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      volumes:
        - postgres_data_lite:/var/lib/postgresql/data

  redis:
      image: redis:7-alpine

  # 1. Backend API (Django)
  backend:
    build:
      context: ..
      dockerfile: infradocker/backend.Dockerfile
    volumes:
      - ../backend:/app/backend
    working_dir: /app/backend
    environment:
      - DEBUG=True
      - DB_NAME=instabot_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  # 2. Automation Engine (Celery Worker)
  automation:
    build:
      context: ..
      dockerfile: infradocker/automation.Dockerfile
    volumes:
      - ..:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DB_HOST=db
      - DB_NAME=instabot_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    command: celery -A backend.config worker --loglevel=info
    depends_on:
      - redis
      - db

  # 3. Frontend (React/Nginx)
  frontend:
    build:
      context: ..
      dockerfile: infradocker/frontend.Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data_lite:
